<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Toca da Lagartixa</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0b10">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Toca Lagartixa">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="tela-login" class="tela-central">
    <div class="cartao">
      <div class="marca">
        <img class="logo" src="/img/logo.png" alt="Toca da Lagartixa">
        <h1>Toca da Lagartixa</h1>
        <p>Acesso interno</p>
      </div>
      <div id="erro-login" class="mensagem-erro"></div>
      <form id="form-login">
        <div class="campo">
          <label for="login-usuario">Usuário</label>
          <input type="text" id="login-usuario" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="botao">Entrar</button>
      </form>
    </div>
  </div>

  <!-- TELA DE PRIMEIRO ACESSO -->
  <div id="tela-primeiro-acesso" class="tela-central oculto">
    <div class="cartao" style="max-width: 420px;">
      <div class="marca">
        <img class="logo" src="/img/logo.png" alt="Toca da Lagartixa">
        <h1>Primeiro acesso</h1>
        <p>Complete seu cadastro para continuar</p>
      </div>
      <div id="erro-primeiro-acesso" class="mensagem-erro"></div>
      <form id="form-primeiro-acesso">
        <div class="campo">
          <label for="pa-nome">Nome completo</label>
          <input type="text" id="pa-nome" required>
        </div>
        <div class="campo">
          <label for="pa-email">E-mail</label>
          <input type="email" id="pa-email" required>
        </div>
        <div class="campo">
          <label for="pa-telefone">Telefone (só números)</label>
          <input type="text" id="pa-telefone" required>
        </div>
        <div class="campo">
          <label for="pa-cpf">CPF (só números)</label>
          <input type="text" id="pa-cpf" required>
        </div>
        <div class="campo">
          <label for="pa-novo-login">Novo usuário</label>
          <input type="text" id="pa-novo-login" required>
        </div>
        <div class="campo">
          <label for="pa-nova-senha">Nova senha (mín. 8 caracteres)</label>
          <input type="password" id="pa-nova-senha" required minlength="8">
        </div>
        <button type="submit" class="botao">Concluir cadastro</button>
      </form>
    </div>
  </div>

  <!-- TELA DE TROCA DE SENHA OBRIGATÓRIA -->
  <div id="tela-trocar-senha" class="tela-central oculto">
    <div class="cartao">
      <div class="marca">
        <img class="logo" src="/img/logo.png" alt="Toca da Lagartixa">
        <h1>Nova senha</h1>
        <p>Sua senha foi redefinida. Defina uma nova para continuar.</p>
      </div>
      <div id="erro-trocar-senha" class="mensagem-erro"></div>
      <form id="form-trocar-senha">
        <div class="campo">
          <label for="ts-nova-senha">Nova senha (mín. 8 caracteres)</label>
          <input type="password" id="ts-nova-senha" required minlength="8">
        </div>
        <button type="submit" class="botao">Salvar nova senha</button>
      </form>
    </div>
  </div>

  <!-- SHELL DO DASHBOARD -->
  <div id="app-shell" class="app-shell">
    <nav class="barra-lateral">
      <div class="marca-mini"><img src="/img/logo.png" alt=""> Toca da Lagartixa</div>
      <div class="nav-lista">
        <button class="nav-item ativo" data-view="inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
          <span>Início</span>
        </button>
        <button class="nav-item" data-view="agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Agenda</span>
        </button>
        <button class="nav-item" data-view="metas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>
          <span>Minha Meta</span>
        </button>
        <button class="nav-item" data-view="beneficios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M3 13h18M12 9v12"/><path d="M8 9c-1.5 0-2.5-1-2.5-2.5S6.5 4 8 4c2 0 4 2.5 4 5"/><path d="M16 9c1.5 0 2.5-1 2.5-2.5S17.5 4 16 4c-2 0-4 2.5-4 5"/></svg>
          <span>Benefícios</span>
        </button>
        <button class="nav-item" data-view="estoque">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          <span>Estoque</span>
        </button>
        <button class="nav-item apenas-socio oculto" data-view="financeiro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.3c0 3 6 1.4 6 4.3 0 1.4-1.3 2.4-3 2.4s-3-1-3-2.4"/></svg>
          <span>Financeiro</span>
        </button>
        <button class="nav-item" data-view="melhorias">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span>Melhorias</span>
        </button>
        <button class="nav-item" data-view="comunicados">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11a9 9 0 0118 0v6a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3"/><path d="M9 19a2 2 0 004 0"/></svg>
          <span>Comunicados</span>
        </button>
        <button class="nav-item apenas-socio oculto" data-view="usuarios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M15.5 14.2c2.3.4 4 2.2 4 4.8"/></svg>
          <span>Usuários</span>
        </button>
        <button class="nav-item" data-view="condicoes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>
          <span>Sobre o estúdio</span>
        </button>
        <button class="nav-item nav-item-sair" data-view="perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span>Meu Perfil</span>
        </button>
      </div>
      <div class="rodape-usuario">
        <div id="usuario-logado-nome"></div>
      </div>
    </nav>
    <main class="conteudo-principal" id="conteudo-principal">
      <h2>Carregando...</h2>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
